name: cekbmiku
description: CekBMIKu Flutter - versi materi kuliah BLoC/Cubit dan go_router.
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.3
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  go_router: ^14.8.1
  flutter_local_notifications: ^19.5.0
  flutter_timezone: ^4.1.1
  timezone: ^0.10.1
  image_picker: ^1.1.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/articles/
    - assets/images/recommendations/
    - assets/images/editorial/
